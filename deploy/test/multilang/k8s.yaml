# Long-running pods for every symbolization and memory route the agent supports.
#
# Each pod compiles its fixture at start-up from a ConfigMap, so the manifest
# is self-contained and needs no private image build. The Go pod exercises
# .gopclntab + ELF and the runtime heap, Node and Java exercise
# /tmp/perf-<pid>.map, Python 3.12 exercises the perf trampoline, and
# C/C++/Rust exercise native symbols with frame pointers. Every native
# fixture also allocates through malloc so alloc_space/inuse_space have
# something to report; Java is deliberately CPU-only because the agent does
# not read JVM heap. The agent must run with hostPID/privileged to see these
# processes; that is the chart default.
apiVersion: v1
kind: ConfigMap
metadata:
  name: multilang-sources
  namespace: lidlesseye
data:
  app.go: |
    package main

    import "math"

    var sink float64
    var keep = make([][]byte, 256)
    var next int

    func remember(block []byte) {
      keep[next] = block
      next = (next + 1) % len(keep)
    }

    func hotA(value float64) float64 {
      block := make([]byte, 4096)
      block[0] = byte(int(value) & 255)
      remember(block)
      return math.Sin(value) + math.Cos(value) + float64(block[0])
    }

    func hotB(value float64) float64 {
      page := new([512]byte)
      page[0] = byte(int(value) & 255)
      return math.Sqrt(value) + hotA(value+float64(page[0]))
    }

    func main() {
      for {
        sink = hotB(sink + 1)
      }
    }
  hot.c: |
    #include <math.h>
    #include <stdlib.h>
    volatile double c_sink;
    static void *c_live[256];
    static int c_live_len = 0;
    __attribute__((noinline)) double c_hot_leaf(double value) {
      char *block = malloc(4096);
      block[0] = (char)value;
      if (c_live_len < 256) c_live[c_live_len++] = block; else free(block);
      return sqrt(value) + sin(value) + cos(value) + block[0];
    }
    __attribute__((noinline)) double c_hot_mid(double value) {
      double total = 0;
      for (int i = 0; i < 64; i += 1) total += c_hot_leaf(value + i);
      return total;
    }
    __attribute__((noinline)) double c_hot_top(double value) {
      double total = 0;
      for (int i = 0; i < 8; i += 1) total += c_hot_mid(value + i * 64);
      return total;
    }
    int main(void) { for (;;) c_sink = c_hot_top(c_sink + 1); }
  hot.cpp: |
    #include <cmath>
    #include <cstdlib>
    volatile double cpp_sink;
    static void *cpp_live[256];
    static int cpp_live_len = 0;
    struct CppHot {
      __attribute__((noinline)) static double leaf(double value) {
        char *block = static_cast<char *>(malloc(4096));
        block[0] = static_cast<char>(value);
        if (cpp_live_len < 256) cpp_live[cpp_live_len++] = block; else free(block);
        return std::sqrt(value) + std::sin(value) + std::cos(value) + block[0];
      }
      __attribute__((noinline)) static double mid(double value) {
        double total = 0;
        for (int i = 0; i < 64; ++i) total += leaf(value + i);
        return total;
      }
      __attribute__((noinline)) static double top(double value) {
        double total = 0;
        for (int i = 0; i < 8; ++i) total += mid(value + i * 64);
        return total;
      }
    };
    int main() { for (;;) cpp_sink = CppHot::top(cpp_sink + 1); }
  hot.rs: |
    use std::hint::black_box;
    use std::sync::{Mutex, OnceLock};

    static KEEP: OnceLock<Mutex<Vec<Box<[u8; 4096]>>>> = OnceLock::new();

    fn keep(block: Box<[u8; 4096]>) {
      let mut held = KEEP
        .get_or_init(|| Mutex::new(Vec::with_capacity(256)))
        .lock()
        .unwrap();
      if held.len() < 256 {
        held.push(block);
      }
    }

    #[inline(never)] #[no_mangle]
    pub extern "C" fn rust_hot_leaf(value: f64) -> f64 {
      let tag = value as u8;
      let mut block = Box::new([0u8; 4096]);
      block[0] = tag;
      keep(block);
      value.sqrt() + value.sin() + value.cos() + black_box(tag) as f64
    }
    #[inline(never)] #[no_mangle]
    pub extern "C" fn rust_hot_mid(value: f64) -> f64 {
      let mut total = 0.0;
      for i in 0..64 { total += rust_hot_leaf(black_box(value + i as f64)); }
      total
    }
    #[inline(never)] #[no_mangle]
    pub extern "C" fn rust_hot_top(value: f64) -> f64 {
      let mut total = 0.0;
      for i in 0..8 { total += rust_hot_mid(black_box(value + i as f64 * 64.0)); }
      total
    }
    fn main() {
      let mut sink = 0.0f64;
      loop { sink = rust_hot_top(black_box(sink + 1.0)); black_box(sink); }
    }
  Hot.java: |
    public final class Hot {
      private static volatile double sink = 0.0;
      public static double javaHotLeaf(double value) {
        return Math.sqrt(value) + Math.sin(value) + Math.cos(value);
      }
      public static double javaHotMid(double value) {
        double total = 0;
        for (int i = 0; i < 64; i++) total += javaHotLeaf(value + i);
        return total;
      }
      public static double javaHotTop(double value) {
        double total = 0;
        for (int i = 0; i < 8; i++) total += javaHotMid(value + i * 64);
        return total;
      }
      public static void main(String[] args) {
        for (;;) sink = javaHotTop(sink + 1);
      }
    }
  hot.py: |
    import math

    keep = []

    def py_hot_leaf(value):
      block = bytes(4096)
      keep.append(block)
      if len(keep) > 256:
        del keep[0]
      return math.sqrt(value) + math.sin(value) + math.cos(value) + block[0]

    def py_hot_mid(value):
      total = 0.0
      for i in range(64):
        total += py_hot_leaf(value + i)
      return total

    def py_hot_top(value):
      total = 0.0
      for i in range(8):
        total += py_hot_mid(value + i * 64)
      return total

    sink = 0.0
    while True:
      sink = py_hot_top(sink + 1)
  hot.js: |
    const keep = [];

    function nodeHotLeaf(n) {
      const block = Buffer.allocUnsafe(4096);
      block[0] = n & 255;
      keep.push(block);
      if (keep.length > 256) keep.shift();
      let total = 0;
      for (let i = 0; i < n; i += 1) total += Math.sqrt(i) * Math.sin(i) + block[0];
      return total;
    }
    function nodeHotMid(n) {
      let total = 0;
      for (let i = 0; i < 8; i += 1) total += nodeHotLeaf(n);
      return total;
    }
    function nodeHotTop(n) {
      let total = 0;
      for (let i = 0; i < 4; i += 1) total += nodeHotMid(n);
      return total;
    }
    let sink = 0;
    for (;;) {
      sink += nodeHotTop(100_000);
      if (!Number.isFinite(sink)) sink = 0;
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multilang-go
  namespace: lidlesseye
spec:
  replicas: 1
  selector:
    matchLabels:
      app: multilang-go
  template:
    metadata:
      labels:
        app: multilang-go
        lidlesseye-fixture: multilang
    spec:
      containers:
        - name: app
          image: golang:1.23-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - 'cd /src && CGO_ENABLED=0 go build -trimpath -o /tmp/hot app.go && exec /tmp/hot'
          volumeMounts:
            - name: sources
              mountPath: /src
              readOnly: true
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: sources
          configMap:
            name: multilang-sources
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multilang-node
  namespace: lidlesseye
spec:
  replicas: 1
  selector:
    matchLabels:
      app: multilang-node
  template:
    metadata:
      labels:
        app: multilang-node
        lidlesseye-fixture: multilang
    spec:
      containers:
        - name: app
          image: node:22-bookworm-slim
          command:
            - node
            - --perf-basic-prof-only-functions
            - --interpreted-frames-native-stack
            - /src/hot.js
          volumeMounts:
            - name: sources
              mountPath: /src
              readOnly: true
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 200m, memory: 256Mi }
      volumes:
        - name: sources
          configMap:
            name: multilang-sources
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multilang-c
  namespace: lidlesseye
spec:
  replicas: 1
  selector:
    matchLabels:
      app: multilang-c
  template:
    metadata:
      labels:
        app: multilang-c
        lidlesseye-fixture: multilang
    spec:
      containers:
        - name: app
          image: gcc:bookworm
          command: ["sh", "-c"]
          args:
            - gcc -O2 -g -fno-omit-frame-pointer -fno-inline -o /tmp/hot /src/hot.c -lm && exec /tmp/hot
          volumeMounts:
            - name: sources
              mountPath: /src
              readOnly: true
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
      volumes:
        - name: sources
          configMap:
            name: multilang-sources
---
