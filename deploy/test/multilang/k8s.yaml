apiVersion: apps/v1
kind: Deployment
metadata:
  name: multilang-rust
  namespace: lidlesseye
spec:
  replicas: 1
  selector:
    matchLabels:
      app: multilang-rust
  template:
    metadata:
      labels:
        app: multilang-rust
        lidlesseye-fixture: multilang
    spec:
      containers:
        - name: app
          image: rust:1.98-bookworm
          command: ["sh", "-c"]
          args:
            - RUSTFLAGS="-C force-frame-pointers=yes" rustc -O -C debuginfo=2 -o /tmp/hot /src/hot.rs && exec /tmp/hot
          volumeMounts:
            - name: sources
              mountPath: /src
              readOnly: true
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 200m, memory: 256Mi }
      volumes:
        - name: sources
          configMap:
            name: multilang-sources
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multilang-python
  namespace: lidlesseye
spec:
  replicas: 1
  selector:
    matchLabels:
      app: multilang-python
  template:
    metadata:
      labels:
        app: multilang-python
        lidlesseye-fixture: multilang
    spec:
      containers:
        - name: app
          image: python:3.12-slim
          command: ["python", "-X", "perf", "/src/hot.py"]
          env:
            - name: PYTHONPERFSUPPORT
              value: "1"
          volumeMounts:
            - name: sources
              mountPath: /src
              readOnly: true
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 200m, memory: 256Mi }
      volumes:
        - name: sources
          configMap:
            name: multilang-sources
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multilang-java
  namespace: lidlesseye
spec:
  replicas: 1
  selector:
    matchLabels:
      app: multilang-java
  template:
    metadata:
      labels:
        app: multilang-java
        lidlesseye-fixture: multilang
    spec:
      initContainers:
        - name: jdk-headers
          image: eclipse-temurin:21-jdk
          command: ["sh", "-c"]
          args:
            - cp -r /opt/java/openjdk/include /agent/ && mkdir -p /agent/out
          volumeMounts:
            - name: agent
              mountPath: /agent
        - name: build-perfmap
          image: gcc:bookworm
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              git -c http.sslVerify=false clone --depth 1 \
                https://github.com/jvm-profiling-tools/perf-map-agent.git /tmp/perf-map-agent
              gcc -shared -fPIC \
                -I/agent/include -I/agent/include/linux \
                -o /agent/out/libperfmap.so \
                /tmp/perf-map-agent/src/c/perf-map-agent.c \
                /tmp/perf-map-agent/src/c/perf-map-file.c
              cp -r /tmp/perf-map-agent/src /agent/src
          volumeMounts:
            - name: agent
              mountPath: /agent
      containers:
        - name: app
          image: eclipse-temurin:21-jdk
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              javac -d /tmp/attach /agent/src/java/AttachOnce.java
              jar cfe /agent/out/attach-main.jar net.virtualvoid.perf.AttachOnce -C /tmp/attach .
              javac -g -d /app /src/Hot.java
              cd /agent/out
              java -XX:+PreserveFramePointer -XX:+UnlockDiagnosticVMOptions \
                -XX:+DebugNonSafepoints -cp /app Hot &
              pid=$!
              trap 'kill "$pid" 2>/dev/null || true' EXIT
              while kill -0 "$pid" 2>/dev/null; do
                java -cp attach-main.jar net.virtualvoid.perf.AttachOnce "$pid" >/dev/null 2>&1 || true
                sleep 5
              done
              wait "$pid"
          volumeMounts:
            - name: sources
              mountPath: /src
              readOnly: true
            - name: agent
              mountPath: /agent
          resources:
            requests: { cpu: 20m, memory: 128Mi }
            limits: { cpu: 250m, memory: 512Mi }
      volumes:
        - name: sources
          configMap:
            name: multilang-sources
        - name: agent
          emptyDir: {}
