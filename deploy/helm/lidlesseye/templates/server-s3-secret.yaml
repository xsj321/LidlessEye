{{- /*
S3 credentials for Parquet storage mode. When an existing Secret is named in
`server.storage.s3.existingSecret`, the Deployment reads from it directly and
this template renders nothing. Otherwise the inline keys are stored here and
injected as environment variables, so credentials never appear in the pod spec.
*/ -}}
{{- if and (eq .Values.server.storage.mode "parquet") (not .Values.server.storage.s3.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lidlesseye.fullname" . }}-s3
  labels:
    {{- include "lidlesseye.labels" . | nindent 4 }}
type: Opaque
stringData:
  access-key: {{ .Values.server.storage.s3.accessKey | quote }}
  secret-key: {{ .Values.server.storage.s3.secretKey | quote }}
{{- end }}
