{{- if and .Values.server.auth.enabled (not .Values.server.auth.existingSecret) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-auth" (include "lidlesseye.fullname" .)) }}
{{- $token := .Values.server.auth.token }}
{{- if and (not $token) $existing }}
{{- $token = index $existing.data "token" | b64dec }}
{{- end }}
{{- if not $token }}
{{- $token = randAlphaNum 48 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-auth" (include "lidlesseye.fullname" .) }}
  labels:
    {{- include "lidlesseye.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ $token | b64enc | quote }}
{{- end }}
