{{- if and .Values.server.tenants.tokens (not .Values.server.tenants.existingSecret) }}
{{- $pairs := list }}
{{- range .Values.server.tenants.tokens }}
{{- $pairs = append $pairs (printf "%s=%s" .token .tenant) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lidlesseye.tenantsSecretName" . }}
  labels:
    {{- include "lidlesseye.labels" . | nindent 4 }}
type: Opaque
stringData:
  # `token=tenant,token=tenant`; the server reads it from
  # LIDLESSEYE_TENANT_TOKENS so the tokens stay out of the pod spec.
  tenant-tokens: {{ join "," $pairs | quote }}
{{- end }}
