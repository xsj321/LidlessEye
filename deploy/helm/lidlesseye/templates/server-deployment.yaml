apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lidlesseye.fullname" . }}
  labels:
    {{- include "lidlesseye.server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.server.replicaCount }}
  # The data directory has a single writer; a rolling update would give two
  # pods the same volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "lidlesseye.server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lidlesseye.server.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "lidlesseye.serviceAccountName" . }}
      {{- if .Values.server.profiling.enabled }}
      # The built-in collector needs the host PID namespace to read the
      # processes it samples, exactly like the agent DaemonSet.
      hostPID: true
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: server
          image: {{ include "lidlesseye.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --retention={{ .Values.server.retention }}
            - --max-disk={{ .Values.server.maxDisk }}
            {{- if .Values.server.cors }}
            - --cors={{ .Values.server.cors }}
            {{- end }}
            - --tenant-header={{ .Values.server.tenants.header }}
            - --max-tenants={{ .Values.server.tenants.maxTenants }}
            {{- /* `hasKey`, not `default`: 0 is a meaningful value here (no
                   cap), and `default` would rewrite it. A release upgraded
                   with --reuse-values predates this key, so it must fall back
                   to the flag's own default rather than render empty. */}}
            - --query-concurrency={{ ternary .Values.server.queryConcurrency 4 (hasKey .Values.server "queryConcurrency") }}
            - --storage-mode={{ .Values.server.storage.mode }}
            {{- if eq .Values.server.storage.mode "parquet" }}
            - --s3-bucket={{ .Values.server.storage.s3.bucket }}
            - --s3-prefix={{ .Values.server.storage.s3.prefix }}
            - --s3-endpoint={{ .Values.server.storage.s3.endpoint }}
            - --s3-region={{ .Values.server.storage.s3.region }}
            - --s3-url-style={{ .Values.server.storage.s3.urlStyle }}
            - --s3-use-ssl={{ .Values.server.storage.s3.useSSL }}
            - --parquet-local-ttl={{ .Values.server.storage.localTTL }}
            {{- end }}
            {{- range .Values.server.tenants.allowed }}
            - --allowed-tenant={{ . }}
            {{- end }}
            {{- range .Values.server.tenants.limits }}
            - {{ printf "--tenant-limit=%s" . | quote }}
            {{- end }}

            {{- if .Values.server.profiling.enabled }}
            - --agent
            - --frequency={{ .Values.agent.frequency }}
            - --flush={{ .Values.agent.flush }}
            - --tenant={{ .Values.agent.tenant }}
            {{- end }}
            {{- range .Values.server.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: LIDLESSEYE_DATA_DIR
              value: /var/lib/lidlesseye
            - name: LIDLESSEYE_LISTEN
              value: 0.0.0.0:{{ .Values.server.service.port }}
            {{- if eq .Values.server.storage.mode "parquet" }}
            - name: LIDLESSEYE_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "lidlesseye.s3SecretName" . }}
                  key: access-key
            - name: LIDLESSEYE_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "lidlesseye.s3SecretName" . }}
                  key: secret-key
            {{- end }}
            {{- if .Values.server.profiling.enabled }}
            - name: LIDLESSEYE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- end }}
            {{- if or .Values.server.tenants.tokens .Values.server.tenants.existingSecret }}
            - name: LIDLESSEYE_TENANT_TOKENS
              valueFrom:
                secretKeyRef:
                  name: {{ include "lidlesseye.tenantsSecretName" . }}
                  key: tenant-tokens
            {{- end }}
            {{- if .Values.server.auth.enabled }}
            - name: LIDLESSEYE_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "lidlesseye.authSecretName" . }}
                  key: token
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.server.service.port }}
              protocol: TCP
          # A slow start must not look like a crash. Opening a tenant's store
          # in Parquet mode lists its S3 prefix, so a server with a dozen
          # tenants and a large archive can take a minute or two before it
          # serves its first request. The startup probe gives it that time;
          # only after it passes does liveness judge the running process.
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          {{- if .Values.server.profiling.enabled }}
          # Loading BPF programs needs CAP_BPF/CAP_PERFMON and CAP_SYS_ADMIN;
          # without them `--agent` serves an empty profile set forever.
          securityContext:
            privileged: true
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/lidlesseye
            {{- if .Values.server.profiling.enabled }}
            {{- if .Values.agent.mountDebugfs }}
            - name: debugfs
              mountPath: /sys/kernel/debug
              readOnly: true
            {{- end }}
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.server.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.server.persistence.existingClaim | default (printf "%s-data" (include "lidlesseye.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.server.profiling.enabled }}
        {{- if .Values.agent.mountDebugfs }}
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
            type: Directory
        {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
