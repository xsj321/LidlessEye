# Default values for the LidlessEye chart.
#
# The chart installs two things:
#   * a **server** Deployment (ingest + storage + query API + embedded UI), and
#   * an **agent** DaemonSet that samples every node's CPU and off-CPU stacks
#     with eBPF and pushes the profiles to that server.

image:
  repository: ghcr.io/lidlesseye/lidlesseye
  # Defaults to the chart's appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}

server:
  # DuckDB takes an exclusive lock on each tenant database file. Two replicas
  # sharing a PVC would fail at startup, so the Deployment uses `Recreate` and
  # this must stay 1. Scale by sharding tenants across independent deployments.
  replicaCount: 1

  service:
    type: ClusterIP
    port: 4040
    annotations: {}

  # Retention is enforced by a background task: batches older than this are
  # deleted, and the estimate of the retained data is trimmed to `maxDisk`.
  # DuckDB does not shrink the file, so the PVC must be sized for the
  # high-water mark rather than for `maxDisk` alone.
  retention: 7d
  maxDisk: 40GB

  # Bearer token required by every API call when set. The agent picks it up
  # from the same secret, so agents and server stay in sync.
  auth:
    enabled: false
    # Leave empty to have Helm generate one on install (kept across upgrades).
    token: ""
    existingSecret: ""

  # Allowed CORS origin; empty disables the CORS layer.
  cors: ""

  # Multi-tenancy. Each request names its tenant with a header; the chart
  # leaves everything open by default so a single-team install needs no
  # configuration.
  tenants:
    # Header carrying the tenant id. The Pyroscope/Grafana default is
    # X-Scope-OrgID; change it when a gateway in front already owns that name.
    header: X-Scope-OrgID
    # Reject every tenant not listed here. Empty means "any valid id, created
    # by the first write".
    allowed: []
    # Maximum number of tenants the server will host.
    maxTenants: 1000
    # Per-tenant limits: `<tenant>:<field>=<value>` where field is
    # `retention`, `max_disk` or `max_series`. Example:
    #   limits:
    #     - "acme:max_series=50000"
    #     - "acme:retention=30d"
    limits: []
    # Bind a token to one tenant. Implies authentication is required, and the
    # token decides the tenant, so the agent no longer sends a header.
    #   tokens:
    #     - token: "s3cret"
    #       tenant: acme
    # Tokens are stored in a Secret and passed as LIDLESSEYE_TENANT_TOKENS, so
    # they never appear in the pod spec.
    tokens: []
    # Use your own Secret (key: `tenant-tokens`) instead of the generated one.
    existingSecret: ""

  persistence:
    enabled: true
    size: 50Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    existingClaim: ""

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      memory: 2Gi

  # The server can profile its own node too; the dedicated DaemonSet is usually
  # the better choice because it survives server restarts.
  profiling:
    enabled: false

  metrics:
    serviceMonitor:
      enabled: false
      interval: 30s
      scrapeTimeout: 10s
      labels: {}

  extraArgs: []

agent:
  enabled: true

  # Per-CPU sampling frequency. 99Hz is the usual trade-off; higher gives finer
  # detail at a roughly linear cost in overhead.
  frequency: 99
  flush: 10s
  collectCpu: true
  collectOffCpu: true

  # Empty means "one service per process" (the process name is used). Set it to
  # aggregate a whole node under a single service name.
  serviceName: ""
  # Extra labels attached to every report.
  labels: {}

  # Derive k8s_* labels (namespace/pod/container) from each process's cgroup.
  enrichKubernetesLabels: true

  # The agent must see the host PID namespace to symbolize stacks, and needs
  # privileges to load BPF programs. These are the defaults that work; override
  # only if you know what you are doing.
  hostPID: true
  privileged: true
  # Mounts debugfs, which some kernels need for uprobes.
  mountDebugfs: true

  tolerations:
    - operator: Exists
      effect: NoSchedule
  nodeSelector: {}
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

  extraArgs: []

  podAnnotations: {}
