# Default values for the LidlessEye chart.
#
# The chart installs two things:
#   * a **server** Deployment (ingest + storage + query API + embedded UI), and
#   * an **agent** DaemonSet that samples every node's CPU and off-CPU stacks
#     with eBPF and pushes the profiles to that server.

image:
  # Docker Hub is the registry the chart points at; the release workflow mirrors
  # the same manifest to ghcr.io/xsj321/lidlesseye. `docker.io/` is spelled out
  # because a bare `xsj321/lidlesseye` means `docker.io/library/xsj321/lidlesseye`
  # to the daemon and something else again to a chart — a pull failure either way.
  repository: docker.io/xsj321/lidlesseye
  # Empty means the chart's appVersion, which is also the tag the release
  # workflow publishes, so a chart and its image cannot drift apart. A local
  # build overrides this with its own distinct tag (see docs/deployment.md).
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}

server:
  # DuckDB takes an exclusive lock on each tenant database file. Two replicas
  # sharing a PVC would fail at startup, so the Deployment uses `Recreate` and
  # this must stay 1. Scale by sharding tenants across independent deployments.
  replicaCount: 1

  service:
    type: ClusterIP
    port: 4040
    annotations: {}

  # Retention is enforced by a background task: batches older than this are
  # deleted, and the estimate of the retained data is trimmed to `maxDisk`.
  # DuckDB does not shrink the file, so the PVC must be sized for the
  # high-water mark rather than for `maxDisk` alone.
  retention: 7d
  maxDisk: 40GB

  # How many queries may read the store at once. Each read holds one DuckDB
  # connection while it runs, so a larger number mostly deepens the queue while
  # the scans wait their turn. Set it to roughly the number of dashboard panels
  # plus one, not to the CPU count: the point of the cap is that waiting costs
  # no thread, which is what keeps the liveness probe answerable during a wide
  # scan. `0` removes the cap (not recommended).
  queryConcurrency: 4

  # Physical storage backend. Neither mode writes a persistent DuckDB file:
  #   disk - in-memory hot tier + local Parquet finals (default).
  #   s3   - in-memory hot tier + local staging, uploaded to S3 only after the
  #          object has been verified readable; the PVC keeps no DuckDB file.
  # Old values `duckdb` and `parquet` are accepted with a warning and mapped
  # to `disk` / `s3`; existing databases are exported to Parquet on first open.
  storage:
    mode: disk
    # Maximum data-loss window when a pod is killed before a flush.
    flushInterval: 10s
    # How long a local fragment may wait before being merged (and, in s3 mode,
    # uploaded). Queries read local files inside this window.
    localTTL: 1h
    # S3-compatible object store, used only when mode=s3. Works with AWS
    # S3 and with MinIO-style servers. For AWS, leave endpoint empty and set
    # urlStyle to "host"; for MinIO use endpoint + urlStyle=path + useSSL=false.
    s3:
      bucket: ""
      prefix: lidlesseye
      endpoint: ""        # e.g. minio.lidlesseye.svc:9000
      region: us-east-1
      accessKey: ""
      secretKey: ""
      useSSL: true
      urlStyle: path
      # If set, read credentials from this existing Secret instead of the keys
      # above. Expected keys: access-key, secret-key.
      existingSecret: ""

  # Bearer token required by every API call when set. The agent picks it up
  # from the same secret, so agents and server stay in sync.
  auth:
    enabled: false
    # Leave empty to have Helm generate one on install (kept across upgrades).
    token: ""
    existingSecret: ""

  # Allowed CORS origin; empty disables the CORS layer.
  cors: ""

  # Multi-tenancy. Each request names its tenant with a header; the chart
  # leaves everything open by default so a single-team install needs no
  # configuration.
  tenants:
    # Header carrying the tenant id. The Pyroscope/Grafana default is
    # X-Scope-OrgID; change it when a gateway in front already owns that name.
    header: X-Scope-OrgID
    # Reject every tenant not listed here. Empty means "any valid id, created
    # by the first write".
    allowed: []
    # Maximum number of tenants the server will host.
    maxTenants: 1000
    # Per-tenant limits: `<tenant>:<field>=<value>` where field is
    # `retention`, `max_disk` or `max_series`. Example:
    #   limits:
    #     - "acme:max_series=50000"
    #     - "acme:retention=30d"
    limits: []
    # Bind a token to one tenant. Implies authentication is required, and the
    # token decides the tenant, so the agent no longer sends a header.
    #   tokens:
    #     - token: "s3cret"
    #       tenant: acme
    # Tokens are stored in a Secret and passed as LIDLESSEYE_TENANT_TOKENS, so
    # they never appear in the pod spec.
    tokens: []
    # Use your own Secret (key: `tenant-tokens`) instead of the generated one.
    existingSecret: ""

  persistence:
    enabled: true
    size: 50Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    existingClaim: ""

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      memory: 2Gi

  # The server can profile its own node too; the dedicated DaemonSet is usually
  # the better choice because it survives server restarts. Enabling this adds
  # `hostPID`, a privileged container and the debugfs mount to the server pod,
  # because the BPF programs cannot load without them.
  profiling:
    enabled: false

  metrics:
    serviceMonitor:
      enabled: false
      interval: 30s
      scrapeTimeout: 10s
      labels: {}

  extraArgs: []

agent:
  enabled: true

  # Per-CPU sampling frequency. 99Hz is the usual trade-off; higher gives finer
  # detail at a roughly linear cost in overhead.
  frequency: 99
  flush: 10s
  # Upload queues are bounded on purpose: when the server is slow the agent
  # drops the newest data instead of growing until the kernel OOM-kills it.
  reportQueue: 256
  mapQueue: 64
  collectCpu: true
  collectOffCpu: true

  # Empty means "one service per process" (the process name is used). Set it to
  # aggregate a whole node under a single service name.
  serviceName: ""
  # Tenant the agents write to. It must be listed in `server.tenants.allowed`
  # (when that is non-empty) or the server refuses every upload.
  tenant: default
  # Extra labels attached to every report.
  labels: {}

  # Attach the `k8s_*` labels the agent derives from each process's cgroup
  # (`k8s_pod_uid`, `k8s_qos_class`, `k8s_container`). Set to false when the
  # series count matters more than telling containers apart.
  enrichKubernetesLabels: true

  # A cgroup path carries the pod UID and nothing else, so on its own it cannot
  # name a series: `sh` and `busybox` say nothing about what the pod does. With
  # this on, the agent lists the pods on its node (see `createRBAC`) and adds
  # `k8s_namespace`, `k8s_pod`, `k8s_workload` and `k8s_workload_kind`, and names
  # the series after the pod's service (`app.kubernetes.io/name`, else the
  # Deployment/StatefulSet/DaemonSet name) instead of the binary inside it.
  # Outside a cluster nothing is attempted, so a host install is unaffected.
  podMetadata:
    enabled: true
    # Create the ClusterRole/ClusterRoleBinding that allows `list pods`. Set to
    # false when the service account already has it, e.g. through a shared
    # namespace-scoped role — the agent then simply keeps whatever names it can
    # resolve, and logs the reason once if it may not read pods.
    createRBAC: true
    # How often the cache is refreshed. New pods are named after at most one
    # interval, and their samples are stored against the pod UID meanwhile.
    refresh: 30s

  # Attach a uprobe to TLS libraries (`SSL_write`) so encrypted HTTP and
  # database traffic can contribute a requested host and a SQL statement to the
  # service map. Off by default: every TLS write pays a user-memory read and a
  # protocol check.
  sslUprobe: false

  # The agent must see the host PID namespace to symbolize stacks, and needs
  # privileges to load BPF programs. These are the defaults that work; override
  # only if you know what you are doing.
  hostPID: true
  privileged: true
  # Mounts debugfs, which some kernels need for uprobes.
  mountDebugfs: true

  tolerations:
    - operator: Exists
      effect: NoSchedule
  nodeSelector: {}
  # A node agent symbolizes every process on the node, and a symbolizer keeps
  # the parsed symbol tables of the modules it has seen. 512Mi was enough while
  # every other container's samples were dropped as unattributable; a node
  # running a few Go services (Prometheus, kube-state-metrics, an operator)
  # needs more, and the kernel OOM killer takes the agent down when it runs out.
  # The symbol caches and upload queues are now bounded, but a full node still
  # holds roughly 850Mi of live symbol tables, so leave headroom above that.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1536Mi

  extraArgs: []

  podAnnotations: {}
