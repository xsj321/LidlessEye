name: Image

# A tag produces the two things a release has to hand out: the chart (see
# release.yml) and an image that matches it. The image is built from the same
# Dockerfile used for manual deploys, so a release cannot drift from the
# documented build path.
#
# It is published to two registries. GHCR needs no setup and always runs;
# Docker Hub is what the chart defaults to, and its login only runs when
# DOCKERHUB_USERNAME and DOCKERHUB_TOKEN exist as repository secrets. The
# Docker Hub copy is a manifest copy of the GHCR image rather than a second
# build, so the two registries cannot serve different bytes.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is optional infrastructure, not a hidden requirement: a
      # missing secret produces a warning and a GHCR-only release rather than a
      # failed one, and the run says which registry the chart will find empty.
      - name: Check for Docker Hub credentials
        id: dockerhub
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$USERNAME" ] && [ -n "$TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not set: publishing to GHCR only. The chart defaults to docker.io, so add both secrets before the next release."
          fi

      - uses: docker/login-action@v4
        if: steps.dockerhub.outputs.enabled == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          # `github.repository` preserves the repository's capitalisation;
          # registries require a lowercase path, so the image name is built from
          # the owner and the chart's name instead of from the repository slug.
          images: ghcr.io/${{ github.repository_owner }}/lidlesseye
          tags: |
            type=ref,event=tag
            # `v0.1.3` is what the release notes tell people to `docker run`,
            # but the chart's `image.tag` defaults to `appVersion`, which has no
            # `v` — so `0.1.3` has to exist as well. Without this line a tag
            # publishes only `v0.1.3`, `0.1` and `latest`, and a fresh
            # `helm install` asks the registry for a tag nothing ever created.
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # `latest` follows the newest stable tag only; a prerelease tag
            # such as v0.2.0-rc.1 must not move it.
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=LidlessEye
            org.opencontainers.image.description=Continuous eBPF profiling server and agent
            org.opencontainers.image.licenses=Apache-2.0

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # `imagetools create` copies the manifest and its blobs by digest. Building
      # again for the second registry would work too, but then two independent
      # builds could disagree and the chart would install something other than
      # what GHCR serves under the same version.
      - name: Mirror the same digest to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r source; do
            [ -n "$source" ] || continue
            target="docker.io/${source#ghcr.io/}"
            echo "==> $source -> $target"
            docker buildx imagetools create --tag "$target" "$source"
          done <<< "$TAGS"

      - name: Report the digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.meta.outputs.digest }}
          DOCKERHUB: ${{ steps.dockerhub.outputs.enabled }}
        run: |
          {
            echo "### Image"
            echo '```'
            echo "$TAGS"
            echo "docker.io/${GITHUB_REPOSITORY_OWNER}/lidlesseye  (mirror: $DOCKERHUB)"
            echo "$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
