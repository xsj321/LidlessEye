name: CI

# Every push and every pull request runs the same three gates that `make` runs
# locally. The dashboard is built before the Rust job on purpose: the export is
# embedded into the binary at compile time, so a Rust test that renders a page
# is testing the assets from `npm run build`, not a stale copy.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # `rust-version` in Cargo.toml is the toolchain the release image uses
      # (`deploy/docker/Dockerfile`), so CI compiles with the same one instead
      # of whatever happens to be stable that week.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build the embedded dashboard
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build && npm run sync
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.4
      - run: helm lint deploy/helm/lidlesseye
      - run: helm template lidlesseye deploy/helm/lidlesseye --namespace observability > /dev/null
