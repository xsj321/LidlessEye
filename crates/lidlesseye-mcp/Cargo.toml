[package]
name = "lidlesseye-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "AI-friendly MCP server for LidlessEye service maps and profiles."
keywords = ["profiling", "ebpf", "mcp", "observability"]
categories = ["development-tools::profiling", "command-line-utilities"]
include = ["src/**", "README.md"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
lidlesseye-servicemap = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "3.11.0", features = ["server", "transport-io"] }
schemars = "1.2.3"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
